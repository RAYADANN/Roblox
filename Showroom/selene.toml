# Selene lint config. Роблокс-стандарт встроен в свежий selene.
# Если std не найден — сгенерируй: `selene generate-roblox-std`.
std = "roblox"

# tests/ — Lune (@shared, @lune); Roblox std ломает string require. Линтим src.
exclude = ["Packages", "ServerPackages", "DevPackages", "tests/**/*"]

[lints]
# Ошибки, которые нельзя игнорировать в AI-написанном коде:
global_usage = "deny"          # запрет _G / глобалов (правило architecture.mdc)
shadowing = "warn"
unused_variable = "warn"
undefined_variable = "deny"
empty_if = "warn"
multiple_statements = "deny"
# Pure *Logic dual-require for Lune CI (`@shared/...`) — Roblox uses script.Parent.
incorrect_standard_library_use = "allow"
